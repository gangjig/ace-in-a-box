[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-in-a-box"
version = "0.1.0"
description = "A mini self-evolving playbook framework implementing the ACE (Agentic Context Engineering) pattern in pure Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gang Ji" }]
keywords = ["llm", "agents", "context-engineering", "ace", "playbook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ace = "ace_in_a_box.cli:main"

[project.urls]
Homepage = "https://github.com/gangjig/ace-in-a-box"

[tool.setuptools]
packages = ["ace_in_a_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]
